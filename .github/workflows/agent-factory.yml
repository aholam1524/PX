name: Agent factory

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, closed, labeled]
  issue_comment:
    types: [created]
  push:
    branches:
      - "feature/**"

concurrency:
  group: agent-factory-${{ github.event.issue.number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  dispatch:
    # FAIL/PASS markers must stay inside the issue_comment+PR group (see ASD factory/tests/test_workflow_if.py).
    if: >
      (github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.pull_request == null) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
        (github.event.label.name == 'agent-dev' || github.event.label.name == 'agent-test' || github.event.label.name == 'agent-review' || github.event.label.name == 'agent-fix' || github.event.label.name == 'agent-conflict')) ||
      (github.event_name == 'pull_request' && github.event.action == 'opened') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
        (github.event.label.name == 'agent-dev' || github.event.label.name == 'agent-test' || github.event.label.name == 'agent-review' || github.event.label.name == 'agent-fix' || github.event.label.name == 'agent-conflict')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (contains(github.event.comment.body, 'factory:test-result:pass') ||
         contains(github.event.comment.body, 'factory:test-result:fail') ||
         contains(github.event.comment.body, 'factory:conflict-resolved'))) ||
      (github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Checkout PR head for CI
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh pr checkout ${{ github.event.issue.number }}
      - name: Checkout ASD factory
        uses: actions/checkout@v4
        with:
          repository: aholam1524/ASD
          ref: main
          path: .asd-factory
          token: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dispatcher
        run: pip install -r .asd-factory/requirements.txt
      - name: Dispatch factory
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REVIEW_PROVIDER: claude
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: python .asd-factory/factory/dispatch.py
