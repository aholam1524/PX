name: Claude review

on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

env:
  ACTIONS_LINUX_RATE_PER_MIN: ${{ vars.ACTIONS_LINUX_RATE_PER_MIN || '0.006' }}

jobs:
  review:
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent-review' &&
      github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout ASD factory
        uses: actions/checkout@v4
        with:
          repository: aholam1524/ASD
          ref: main
          path: .asd-factory
          token: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build review prompt
        id: build-prompt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          {
            cat .asd-factory/factory/prompts/review.md
            printf '\n\n## Pull request\n\n'
            printf 'Number: %s\n' "$PR_NUMBER"
            printf 'Title: %s\n' "$PR_TITLE"
            printf 'URL: %s\n\n' "$PR_URL"
            printf '### Description\n\n%s\n' "$PR_BODY"
            printf '\n\n## Review efficiency\n\n'
            printf '%s\n' 'Start with `gh pr diff` and `gh pr view` for this PR. Read only the files that changed; do not explore the rest of the repository. Post **one** review comment (`gh pr review --comment` or `gh pr comment`) as soon as your analysis is done, well before you run out of turns. If you have no findings, still post one comment saying so.'
          } > /tmp/review-prompt.md
          delimiter="$(openssl rand -hex 16)"
          {
            echo "prompt<<${delimiter}"
            cat /tmp/review-prompt.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude review
        id: claude_review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.build-prompt.outputs.prompt }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Post factory usage report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FACTORY_USAGE_JOB: review
          CLAUDE_EXECUTION_FILE: ${{ steps.claude_review.outputs.execution_file }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set +e
          set -u
          
          FACTORY_USAGE_JOB="${FACTORY_USAGE_JOB:?}"
          PR_NUMBER="${PR_NUMBER:?}"
          MARKER="<!-- factory:usage:${PR_NUMBER} -->"
          RATE="${ACTIONS_LINUX_RATE_PER_MIN:-0.006}"
          
          END=$(date +%s)
          START="${JOB_START:-$END}"
          ELAPSED=$(( END - START ))
          RUNNER_MIN=$(( (ELAPSED + 59) / 60 ))
          PRIVATE_LINUX=$(awk -v m="$RUNNER_MIN" -v r="$RATE" 'BEGIN { printf "%.4f", m * r }')
          if [[ "${REPO_PRIVATE}" == "true" ]]; then
            LINUX_CELL="\$${PRIVATE_LINUX}"
          else
            LINUX_CELL="billed: \$0.00 (public repo); would be \$${PRIVATE_LINUX} if private"
          fi
          
          TURNS="n/a"
          INPUT_TOK="n/a"
          OUTPUT_TOK="n/a"
          CACHE_READ="n/a"
          CACHE_CREATE="n/a"
          API_COST="n/a"
          DURATION_MS="n/a"
          
          EXEC_FILE="${CLAUDE_EXECUTION_FILE:-}"
          if [[ -n "$EXEC_FILE" && -f "$EXEC_FILE" ]]; then
            RESULT_JSON=$(jq -c '[.[] | select(.type == "result")] | last // empty' "$EXEC_FILE" 2>/dev/null || true)
            if [[ -z "$RESULT_JSON" || "$RESULT_JSON" == "null" ]]; then
              echo "::notice::No result message in execution file; last entry keys: $(jq -r 'if type == "array" and length > 0 then (.[-1] | keys | join(", ")) else "empty" end' "$EXEC_FILE" 2>/dev/null || echo unknown)"
            else
              pick() {
                local expr="$1"
                local label="$2"
                local val
                val=$(jq -r "$expr" <<< "$RESULT_JSON" 2>/dev/null)
                if [[ -z "$val" || "$val" == "null" ]]; then
                  echo "::notice::Missing ${label}; result keys: $(jq -r 'keys | join(", ")' <<< "$RESULT_JSON")"
                  echo "n/a"
                else
                  echo "$val"
                fi
              }
              TURNS=$(pick '.num_turns' 'num_turns')
              DURATION_MS=$(pick '.duration_ms' 'duration_ms')
              INPUT_TOK=$(pick '.usage.input_tokens' 'usage.input_tokens')
              OUTPUT_TOK=$(pick '.usage.output_tokens' 'usage.output_tokens')
              CACHE_READ=$(pick '.usage.cache_read_input_tokens' 'usage.cache_read_input_tokens')
              CACHE_CREATE=$(pick '.usage.cache_creation_input_tokens' 'usage.cache_creation_input_tokens')
              RAW_COST=$(pick '.total_cost_usd' 'total_cost_usd')
              if [[ "$RAW_COST" != "n/a" ]]; then
                API_COST="~\$${RAW_COST} (API-equivalent; subscription — not billed per token)"
              fi
            fi
          elif [[ -n "$EXEC_FILE" ]]; then
            echo "::notice::Claude execution file path set but file missing: ${EXEC_FILE}"
          fi
          
          CURRENT_JSON=$(jq -cn \
            --arg job "$FACTORY_USAGE_JOB" \
            --arg turns "$TURNS" \
            --arg input "$INPUT_TOK" \
            --arg output "$OUTPUT_TOK" \
            --arg cache_read "$CACHE_READ" \
            --arg cache_create "$CACHE_CREATE" \
            --arg api_cost "$API_COST" \
            --arg runner_min "$RUNNER_MIN" \
            --arg linux "$LINUX_CELL" \
            '{job:$job,turns:$turns,input:$input,output:$output,cache_read:$cache_read,cache_create:$cache_create,api_cost:$api_cost,runner_min:$runner_min,linux:$linux}')
          
          extract_row_json() {
            local body="$1"
            local j="$2"
            local open="<!-- factory:usage-data:${j} -->"
            local close="<!-- /factory:usage-data:${j} -->"
            local rest="${body#*${open}}"
            if [[ "$rest" == "$body" ]]; then
              return 0
            fi
            printf '%s' "${rest%%${close}*}"
          }
          
          EXISTING_BODY=""
          COMMENT_ID=""
          COMMENTS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate 2>/dev/null || true)
          if [[ -n "$COMMENTS" ]]; then
            COMMENT_ID=$(jq -r --arg m "$MARKER" '.[] | select(.body | contains($m)) | .id' <<< "$COMMENTS" | head -1)
            if [[ -n "$COMMENT_ID" && "$COMMENT_ID" != "null" ]]; then
              EXISTING_BODY=$(jq -r --argjson id "$COMMENT_ID" '.[] | select(.id == $id) | .body' <<< "$COMMENTS")
            fi
          fi
          
          declare -A ROWS=([review]="" [fix]="" [merge]="")
          if [[ -n "$EXISTING_BODY" ]]; then
            for j in review fix merge; do
              chunk=$(extract_row_json "$EXISTING_BODY" "$j")
              if [[ -n "$chunk" ]]; then
                ROWS[$j]="$chunk"
              fi
            done
          fi
          ROWS[$FACTORY_USAGE_JOB]="$CURRENT_JSON"
          
          format_row() {
            jq -r '"| \(.job) | \(.turns) | \(.input) | \(.output) | \(.cache_read) | \(.cache_create) | \(.api_cost) | \(.runner_min) | \(.linux) |"' <<< "$1"
          }
          
          TABLE="| Job | Turns | Input | Output | Cache read | Cache creation | API-equiv cost | Runner min (billed) | Linux cost |
          | --- | ---: | ---: | ---: | ---: | ---: | --- | ---: | --- |"
          for j in review fix merge; do
            if [[ -n "${ROWS[$j]}" ]]; then
              TABLE+=$'\n'"$(format_row "${ROWS[$j]}")"
            else
              TABLE+=$'\n'"| ${j} | n/a | n/a | n/a | n/a | n/a | n/a | n/a | n/a |"
            fi
          done
          
          DATA_TAGS=""
          for j in review fix merge; do
            if [[ -n "${ROWS[$j]}" ]]; then
              DATA_TAGS+=$'\n'"<!-- factory:usage-data:${j} -->${ROWS[$j]}<!-- /factory:usage-data:${j} -->"
            fi
          done
          
          BODY="${MARKER}
          ### Factory usage (Claude review workflow)
          
          Token **API-equivalent cost** is an estimate only: these jobs use a Claude subscription (\`CLAUDE_CODE_OAUTH_TOKEN\`), not metered API billing.
          
          ${TABLE}
          ${DATA_TAGS}"
          
          {
            echo "### Factory usage — ${FACTORY_USAGE_JOB}"
            echo ""
            echo "Claude duration (ms): ${DURATION_MS}"
            echo ""
            echo "$TABLE"
          } >> "$GITHUB_STEP_SUMMARY"
          
          PAYLOAD=$(jq -n --arg body "$BODY" '{body:$body}')
          if [[ -n "$COMMENT_ID" && "$COMMENT_ID" != "null" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --input - <<< "$PAYLOAD" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - <<< "$PAYLOAD" >/dev/null
          fi

  fix:
    needs: review
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent-review' &&
      github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check fix marker
        id: marker
        run: |
          MARKER="<!-- factory:claude-fix:${PR_NUMBER} -->"
          echo "marker=${MARKER}" >> "$GITHUB_OUTPUT"
          if gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' | grep -Fq "$MARKER"; then
            echo "already_fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_fixed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post fix marker
        if: steps.marker.outputs.already_fixed != 'true'
        run: gh pr comment "$PR_NUMBER" --body "${{ steps.marker.outputs.marker }}"

      - name: Checkout PR head branch
        if: steps.marker.outputs.already_fixed != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Configure git author
        if: steps.marker.outputs.already_fixed != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build fix prompt
        if: steps.marker.outputs.already_fixed != 'true'
        id: build-fix-prompt
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          cat > /tmp/fix-prompt.md <<'EOF'
          You are applying one automated fix pass after Claude review on this pull request.

          Read the review comments on this PR (conversation comments and inline review comments). Apply only fixes that are clearly correct and in scope of the ticket. Add or update tests where a fix changes behavior. Run the repository's tests if any exist. Commit and push to the PR's branch only when you make changes.

          If the review found nothing important, or there is nothing safe to fix, make no commit.

          Rules:
          - Work on the existing PR head branch only; do not create a new branch.
          - Do not open pull requests, merge, or change labels.
          - Do not edit `.github/`, `.cursor/`, or anything under `.asd-factory/` (ASD factory).
          - Use `git add`, `git commit`, and `git push` only for your fixes on this branch.
          - You may use `gh pr view` and `gh pr comment` to read the PR and post a brief summary if helpful.
          - Read the review comments first, make the fixes, and stop.
          EOF
          {
            printf '\n\n## Pull request\n\n'
            printf 'Number: %s\n' "$PR_NUMBER"
            printf 'Title: %s\n' "$PR_TITLE"
            printf 'URL: %s\n\n' "$PR_URL"
            printf 'Branch: %s\n\n' "$HEAD_REF"
            printf '### Description\n\n%s\n' "$PR_BODY"
          } >> /tmp/fix-prompt.md
          delimiter="$(openssl rand -hex 16)"
          {
            echo "prompt<<${delimiter}"
            cat /tmp/fix-prompt.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude fix pass
        if: steps.marker.outputs.already_fixed != 'true'
        id: claude_fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.build-fix-prompt.outputs.prompt }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(pytest:*),Bash(python:*),Bash(npm:*),Bash(npx:*),Bash(make:*),Bash(cargo:*),Bash(go test:*),Bash(go:*)"

      - name: Post factory usage report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FACTORY_USAGE_JOB: fix
          CLAUDE_EXECUTION_FILE: ${{ steps.claude_fix.outputs.execution_file }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set +e
          set -u
          
          FACTORY_USAGE_JOB="${FACTORY_USAGE_JOB:?}"
          PR_NUMBER="${PR_NUMBER:?}"
          MARKER="<!-- factory:usage:${PR_NUMBER} -->"
          RATE="${ACTIONS_LINUX_RATE_PER_MIN:-0.006}"
          
          END=$(date +%s)
          START="${JOB_START:-$END}"
          ELAPSED=$(( END - START ))
          RUNNER_MIN=$(( (ELAPSED + 59) / 60 ))
          PRIVATE_LINUX=$(awk -v m="$RUNNER_MIN" -v r="$RATE" 'BEGIN { printf "%.4f", m * r }')
          if [[ "${REPO_PRIVATE}" == "true" ]]; then
            LINUX_CELL="\$${PRIVATE_LINUX}"
          else
            LINUX_CELL="billed: \$0.00 (public repo); would be \$${PRIVATE_LINUX} if private"
          fi
          
          TURNS="n/a"
          INPUT_TOK="n/a"
          OUTPUT_TOK="n/a"
          CACHE_READ="n/a"
          CACHE_CREATE="n/a"
          API_COST="n/a"
          DURATION_MS="n/a"
          
          EXEC_FILE="${CLAUDE_EXECUTION_FILE:-}"
          if [[ -n "$EXEC_FILE" && -f "$EXEC_FILE" ]]; then
            RESULT_JSON=$(jq -c '[.[] | select(.type == "result")] | last // empty' "$EXEC_FILE" 2>/dev/null || true)
            if [[ -z "$RESULT_JSON" || "$RESULT_JSON" == "null" ]]; then
              echo "::notice::No result message in execution file; last entry keys: $(jq -r 'if type == "array" and length > 0 then (.[-1] | keys | join(", ")) else "empty" end' "$EXEC_FILE" 2>/dev/null || echo unknown)"
            else
              pick() {
                local expr="$1"
                local label="$2"
                local val
                val=$(jq -r "$expr" <<< "$RESULT_JSON" 2>/dev/null)
                if [[ -z "$val" || "$val" == "null" ]]; then
                  echo "::notice::Missing ${label}; result keys: $(jq -r 'keys | join(", ")' <<< "$RESULT_JSON")"
                  echo "n/a"
                else
                  echo "$val"
                fi
              }
              TURNS=$(pick '.num_turns' 'num_turns')
              DURATION_MS=$(pick '.duration_ms' 'duration_ms')
              INPUT_TOK=$(pick '.usage.input_tokens' 'usage.input_tokens')
              OUTPUT_TOK=$(pick '.usage.output_tokens' 'usage.output_tokens')
              CACHE_READ=$(pick '.usage.cache_read_input_tokens' 'usage.cache_read_input_tokens')
              CACHE_CREATE=$(pick '.usage.cache_creation_input_tokens' 'usage.cache_creation_input_tokens')
              RAW_COST=$(pick '.total_cost_usd' 'total_cost_usd')
              if [[ "$RAW_COST" != "n/a" ]]; then
                API_COST="~\$${RAW_COST} (API-equivalent; subscription — not billed per token)"
              fi
            fi
          elif [[ -n "$EXEC_FILE" ]]; then
            echo "::notice::Claude execution file path set but file missing: ${EXEC_FILE}"
          fi
          
          CURRENT_JSON=$(jq -cn \
            --arg job "$FACTORY_USAGE_JOB" \
            --arg turns "$TURNS" \
            --arg input "$INPUT_TOK" \
            --arg output "$OUTPUT_TOK" \
            --arg cache_read "$CACHE_READ" \
            --arg cache_create "$CACHE_CREATE" \
            --arg api_cost "$API_COST" \
            --arg runner_min "$RUNNER_MIN" \
            --arg linux "$LINUX_CELL" \
            '{job:$job,turns:$turns,input:$input,output:$output,cache_read:$cache_read,cache_create:$cache_create,api_cost:$api_cost,runner_min:$runner_min,linux:$linux}')
          
          extract_row_json() {
            local body="$1"
            local j="$2"
            local open="<!-- factory:usage-data:${j} -->"
            local close="<!-- /factory:usage-data:${j} -->"
            local rest="${body#*${open}}"
            if [[ "$rest" == "$body" ]]; then
              return 0
            fi
            printf '%s' "${rest%%${close}*}"
          }
          
          EXISTING_BODY=""
          COMMENT_ID=""
          COMMENTS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate 2>/dev/null || true)
          if [[ -n "$COMMENTS" ]]; then
            COMMENT_ID=$(jq -r --arg m "$MARKER" '.[] | select(.body | contains($m)) | .id' <<< "$COMMENTS" | head -1)
            if [[ -n "$COMMENT_ID" && "$COMMENT_ID" != "null" ]]; then
              EXISTING_BODY=$(jq -r --argjson id "$COMMENT_ID" '.[] | select(.id == $id) | .body' <<< "$COMMENTS")
            fi
          fi
          
          declare -A ROWS=([review]="" [fix]="" [merge]="")
          if [[ -n "$EXISTING_BODY" ]]; then
            for j in review fix merge; do
              chunk=$(extract_row_json "$EXISTING_BODY" "$j")
              if [[ -n "$chunk" ]]; then
                ROWS[$j]="$chunk"
              fi
            done
          fi
          ROWS[$FACTORY_USAGE_JOB]="$CURRENT_JSON"
          
          format_row() {
            jq -r '"| \(.job) | \(.turns) | \(.input) | \(.output) | \(.cache_read) | \(.cache_create) | \(.api_cost) | \(.runner_min) | \(.linux) |"' <<< "$1"
          }
          
          TABLE="| Job | Turns | Input | Output | Cache read | Cache creation | API-equiv cost | Runner min (billed) | Linux cost |
          | --- | ---: | ---: | ---: | ---: | ---: | --- | ---: | --- |"
          for j in review fix merge; do
            if [[ -n "${ROWS[$j]}" ]]; then
              TABLE+=$'\n'"$(format_row "${ROWS[$j]}")"
            else
              TABLE+=$'\n'"| ${j} | n/a | n/a | n/a | n/a | n/a | n/a | n/a | n/a |"
            fi
          done
          
          DATA_TAGS=""
          for j in review fix merge; do
            if [[ -n "${ROWS[$j]}" ]]; then
              DATA_TAGS+=$'\n'"<!-- factory:usage-data:${j} -->${ROWS[$j]}<!-- /factory:usage-data:${j} -->"
            fi
          done
          
          BODY="${MARKER}
          ### Factory usage (Claude review workflow)
          
          Token **API-equivalent cost** is an estimate only: these jobs use a Claude subscription (\`CLAUDE_CODE_OAUTH_TOKEN\`), not metered API billing.
          
          ${TABLE}
          ${DATA_TAGS}"
          
          {
            echo "### Factory usage — ${FACTORY_USAGE_JOB}"
            echo ""
            echo "Claude duration (ms): ${DURATION_MS}"
            echo ""
            echo "$TABLE"
          } >> "$GITHUB_STEP_SUMMARY"
          
          PAYLOAD=$(jq -n --arg body "$BODY" '{body:$body}')
          if [[ -n "$COMMENT_ID" && "$COMMENT_ID" != "null" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --input - <<< "$PAYLOAD" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - <<< "$PAYLOAD" >/dev/null
          fi

  merge:
    needs: fix
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent-review' &&
      github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Wait for checks and merge into dev
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)"

          FACTORY_CI_RUN=""
          for _ in $(seq 1 24); do
            FACTORY_CI_RUN="$(gh run list --commit="$HEAD_SHA" --workflow=factory-ci.yml --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$FACTORY_CI_RUN" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$FACTORY_CI_RUN" ]]; then
            gh pr comment "$PR_NUMBER" --body "Factory: automatic merge into \`dev\` skipped — the Factory CI check did not appear on the current head commit within two minutes after the Claude fix pass."
            exit 0
          fi

          if ! gh run watch "$FACTORY_CI_RUN" --exit-status; then
            gh pr comment "$PR_NUMBER" --body "Factory: automatic merge into \`dev\` skipped — Factory CI did not pass on the current head commit after the Claude fix pass."
            exit 0
          fi
          if ! gh pr merge "$PR_NUMBER" --merge; then
            gh pr comment "$PR_NUMBER" --body "Factory: automatic merge into \`dev\` failed (for example the PR may already be merged or checks regressed). Please merge manually if the PR is still open and CI is green."
            exit 0
          fi

      - name: Post factory usage report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FACTORY_USAGE_JOB: merge
          CLAUDE_EXECUTION_FILE: ''
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set +e
          set -u
          
          FACTORY_USAGE_JOB="${FACTORY_USAGE_JOB:?}"
          PR_NUMBER="${PR_NUMBER:?}"
          MARKER="<!-- factory:usage:${PR_NUMBER} -->"
          RATE="${ACTIONS_LINUX_RATE_PER_MIN:-0.006}"
          
          END=$(date +%s)
          START="${JOB_START:-$END}"
          ELAPSED=$(( END - START ))
          RUNNER_MIN=$(( (ELAPSED + 59) / 60 ))
          PRIVATE_LINUX=$(awk -v m="$RUNNER_MIN" -v r="$RATE" 'BEGIN { printf "%.4f", m * r }')
          if [[ "${REPO_PRIVATE}" == "true" ]]; then
            LINUX_CELL="\$${PRIVATE_LINUX}"
          else
            LINUX_CELL="billed: \$0.00 (public repo); would be \$${PRIVATE_LINUX} if private"
          fi
          
          TURNS="n/a"
          INPUT_TOK="n/a"
          OUTPUT_TOK="n/a"
          CACHE_READ="n/a"
          CACHE_CREATE="n/a"
          API_COST="n/a"
          DURATION_MS="n/a"
          
          EXEC_FILE="${CLAUDE_EXECUTION_FILE:-}"
          if [[ -n "$EXEC_FILE" && -f "$EXEC_FILE" ]]; then
            RESULT_JSON=$(jq -c '[.[] | select(.type == "result")] | last // empty' "$EXEC_FILE" 2>/dev/null || true)
            if [[ -z "$RESULT_JSON" || "$RESULT_JSON" == "null" ]]; then
              echo "::notice::No result message in execution file; last entry keys: $(jq -r 'if type == "array" and length > 0 then (.[-1] | keys | join(", ")) else "empty" end' "$EXEC_FILE" 2>/dev/null || echo unknown)"
            else
              pick() {
                local expr="$1"
                local label="$2"
                local val
                val=$(jq -r "$expr" <<< "$RESULT_JSON" 2>/dev/null)
                if [[ -z "$val" || "$val" == "null" ]]; then
                  echo "::notice::Missing ${label}; result keys: $(jq -r 'keys | join(", ")' <<< "$RESULT_JSON")"
                  echo "n/a"
                else
                  echo "$val"
                fi
              }
              TURNS=$(pick '.num_turns' 'num_turns')
              DURATION_MS=$(pick '.duration_ms' 'duration_ms')
              INPUT_TOK=$(pick '.usage.input_tokens' 'usage.input_tokens')
              OUTPUT_TOK=$(pick '.usage.output_tokens' 'usage.output_tokens')
              CACHE_READ=$(pick '.usage.cache_read_input_tokens' 'usage.cache_read_input_tokens')
              CACHE_CREATE=$(pick '.usage.cache_creation_input_tokens' 'usage.cache_creation_input_tokens')
              RAW_COST=$(pick '.total_cost_usd' 'total_cost_usd')
              if [[ "$RAW_COST" != "n/a" ]]; then
                API_COST="~\$${RAW_COST} (API-equivalent; subscription — not billed per token)"
              fi
            fi
          elif [[ -n "$EXEC_FILE" ]]; then
            echo "::notice::Claude execution file path set but file missing: ${EXEC_FILE}"
          fi
          
          CURRENT_JSON=$(jq -cn \
            --arg job "$FACTORY_USAGE_JOB" \
            --arg turns "$TURNS" \
            --arg input "$INPUT_TOK" \
            --arg output "$OUTPUT_TOK" \
            --arg cache_read "$CACHE_READ" \
            --arg cache_create "$CACHE_CREATE" \
            --arg api_cost "$API_COST" \
            --arg runner_min "$RUNNER_MIN" \
            --arg linux "$LINUX_CELL" \
            '{job:$job,turns:$turns,input:$input,output:$output,cache_read:$cache_read,cache_create:$cache_create,api_cost:$api_cost,runner_min:$runner_min,linux:$linux}')
          
          extract_row_json() {
            local body="$1"
            local j="$2"
            local open="<!-- factory:usage-data:${j} -->"
            local close="<!-- /factory:usage-data:${j} -->"
            local rest="${body#*${open}}"
            if [[ "$rest" == "$body" ]]; then
              return 0
            fi
            printf '%s' "${rest%%${close}*}"
          }
          
          EXISTING_BODY=""
          COMMENT_ID=""
          COMMENTS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate 2>/dev/null || true)
          if [[ -n "$COMMENTS" ]]; then
            COMMENT_ID=$(jq -r --arg m "$MARKER" '.[] | select(.body | contains($m)) | .id' <<< "$COMMENTS" | head -1)
            if [[ -n "$COMMENT_ID" && "$COMMENT_ID" != "null" ]]; then
              EXISTING_BODY=$(jq -r --argjson id "$COMMENT_ID" '.[] | select(.id == $id) | .body' <<< "$COMMENTS")
            fi
          fi
          
          declare -A ROWS=([review]="" [fix]="" [merge]="")
          if [[ -n "$EXISTING_BODY" ]]; then
            for j in review fix merge; do
              chunk=$(extract_row_json "$EXISTING_BODY" "$j")
              if [[ -n "$chunk" ]]; then
                ROWS[$j]="$chunk"
              fi
            done
          fi
          ROWS[$FACTORY_USAGE_JOB]="$CURRENT_JSON"
          
          format_row() {
            jq -r '"| \(.job) | \(.turns) | \(.input) | \(.output) | \(.cache_read) | \(.cache_create) | \(.api_cost) | \(.runner_min) | \(.linux) |"' <<< "$1"
          }
          
          TABLE="| Job | Turns | Input | Output | Cache read | Cache creation | API-equiv cost | Runner min (billed) | Linux cost |
          | --- | ---: | ---: | ---: | ---: | ---: | --- | ---: | --- |"
          for j in review fix merge; do
            if [[ -n "${ROWS[$j]}" ]]; then
              TABLE+=$'\n'"$(format_row "${ROWS[$j]}")"
            else
              TABLE+=$'\n'"| ${j} | n/a | n/a | n/a | n/a | n/a | n/a | n/a | n/a |"
            fi
          done
          
          DATA_TAGS=""
          for j in review fix merge; do
            if [[ -n "${ROWS[$j]}" ]]; then
              DATA_TAGS+=$'\n'"<!-- factory:usage-data:${j} -->${ROWS[$j]}<!-- /factory:usage-data:${j} -->"
            fi
          done
          
          BODY="${MARKER}
          ### Factory usage (Claude review workflow)
          
          Token **API-equivalent cost** is an estimate only: these jobs use a Claude subscription (\`CLAUDE_CODE_OAUTH_TOKEN\`), not metered API billing.
          
          ${TABLE}
          ${DATA_TAGS}"
          
          {
            echo "### Factory usage — ${FACTORY_USAGE_JOB}"
            echo ""
            echo "Claude duration (ms): ${DURATION_MS}"
            echo ""
            echo "$TABLE"
          } >> "$GITHUB_STEP_SUMMARY"
          
          PAYLOAD=$(jq -n --arg body "$BODY" '{body:$body}')
          if [[ -n "$COMMENT_ID" && "$COMMENT_ID" != "null" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --input - <<< "$PAYLOAD" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - <<< "$PAYLOAD" >/dev/null
          fi

