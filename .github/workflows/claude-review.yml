name: Claude review

on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

env:
  GH_REPO: ${{ github.repository }}
  ACTIONS_LINUX_RATE_PER_MIN: ${{ vars.ACTIONS_LINUX_RATE_PER_MIN || '0.006' }}

jobs:
  review:
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent-review' &&
      github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout ASD factory
        uses: actions/checkout@v4
        with:
          repository: aholam1524/ASD
          ref: ${{ vars.ASD_FACTORY_REF || 'main' }}
          path: .asd-factory
          token: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Log ASD factory version
        run: |
          echo "ASD factory ref: ${{ vars.ASD_FACTORY_REF || 'main' }}"
          git -C .asd-factory rev-parse HEAD

      - name: Build review prompt
        id: build-prompt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          {
            cat .asd-factory/factory/prompts/review.md
            printf '\n\n## Pull request\n\n'
            printf 'Number: %s\n' "$PR_NUMBER"
            printf 'Title: %s\n' "$PR_TITLE"
            printf 'URL: %s\n\n' "$PR_URL"
            printf '### Description\n\n%s\n' "$PR_BODY"
            printf '\n\n## Review efficiency\n\n'
            printf '%s\n' 'Start with `gh pr diff` and `gh pr view` for this PR. Read only the files that changed; do not explore the rest of the repository. Post **one** review comment (`gh pr review --comment` or `gh pr comment`) as soon as your analysis is done, well before you run out of turns. If you have no findings, still post one comment saying so.'
            printf '%s\n' 'Every finding must start with exactly one severity label: `[blocking]`, `[should fix]`, or `[minor]`. Open the review with one line counting findings per label, for example: **Findings:** 1 blocking, 2 should fix, 0 minor.'
          } > /tmp/review-prompt.md
          delimiter="$(openssl rand -hex 16)"
          {
            echo "prompt<<${delimiter}"
            cat /tmp/review-prompt.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude review
        id: claude_review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.build-prompt.outputs.prompt }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Post factory usage report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude_review.outputs.execution_file }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: python3 .github/scripts/usage_report.py --job review

  fix:
    needs: review
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent-review' &&
      github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check fix marker
        id: marker
        run: |
          set -euo pipefail
          MARKER="<!-- factory:claude-fix:${PR_NUMBER} -->"
          echo "marker=${MARKER}" >> "$GITHUB_OUTPUT"
          COMMENTS="$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body')"
          if grep -Fq "$MARKER" <<< "$COMMENTS"; then
            echo "already_fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_fixed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head branch
        if: steps.marker.outputs.already_fixed != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Configure git author
        if: steps.marker.outputs.already_fixed != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record head before fix pass
        if: steps.marker.outputs.already_fixed != 'true'
        id: head-before
        run: |
          git fetch origin dev
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build fix prompt
        if: steps.marker.outputs.already_fixed != 'true'
        id: build-fix-prompt
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          SCRIPTS_CHANGED="$(git diff --name-only origin/dev...HEAD | grep '^\.github/scripts/' || true)"
          cat > /tmp/fix-prompt.md <<'EOF'
          You are applying one automated fix pass after Claude review on this pull request.

          Read the review with `gh pr view <number> --json comments,reviews` (the review is posted as a PR review, not only as a conversation comment). Use only that review plus the changed code; do not explore beyond the files this PR changes.

          Fix findings in priority order: all `[blocking]` first, then `[should fix]`. Skip `[minor]` findings and performance rewrites unless the change is trivial and safe.

          After **each** finding you fix: run only the tests relevant to that change (for example `python -m pytest tests/test_x.py -q`), then **commit and push** with a short message that names the finding. If a push is rejected, note it and continue with the remaining findings instead of stopping. Run the full test suite at most once, at the end, if you need it.

          Stop working on new findings by about turn 60 and post the required **Fix pass result** comment listing what you fixed and what you left.

          If the review found nothing important, or there is nothing safe to fix, make no commit.

          Rules:
          - Work on the existing PR head branch only; do not create a new branch.
          - Do not open pull requests, merge, or change labels.
          - Do not edit `.cursor/` or anything under `.asd-factory/` (ASD factory).
          - Do not create new files under `.github/`.
          - **Never** edit anything under `.github/workflows/` (the push token cannot update workflow files). For a finding that concerns a workflow file under `.github/workflows/`, do not change the file; instead include the fix in the **Fix pass result** comment as a suggested patch (one fenced `diff` block per finding, with the file path and a short explanation) and mark the finding `not fixed: workflow file, patch suggested, apply manually`. Do not count that as a fix-pass failure.
          - You may edit a file under `.github/scripts/` only if it appears in the "GitHub scripts changed by this PR" list below.
          - Use `git add`, `git commit`, and `git push` only for your fixes on this branch.
          - You may use `gh pr view` and `gh pr comment` to read and comment on the PR.

          ## Fix pass result comment (required)

          Before you stop, post **one** PR comment (`gh pr comment`) whose body starts with the heading `## Fix pass result` and includes a markdown table with one row per review finding (or state clearly if the review had no findings). Columns: finding (short summary), status (`fixed` or `not fixed`), details (commit SHA, reason such as "out of scope" or "disagree", or for workflow files the suggested `diff` patch).

          End that comment with **exactly one** of these HTML markers on its own line:
          - `<!-- factory:fix-result:all-addressed -->` when every finding is fixed or legitimately not fixed (including workflow findings with a suggested patch) with no remaining actionable issues.
          - `<!-- factory:fix-result:open-findings -->` when any finding remains unaddressed and should block merge if the repo is configured to block on open findings.
          EOF
          {
            printf '\n\n## GitHub scripts changed by this PR\n\n'
            if [[ -z "$SCRIPTS_CHANGED" ]]; then
              printf '_None — do not edit any file under `.github/scripts/`._\n'
            else
              printf '%s\n' "$SCRIPTS_CHANGED"
            fi
            printf '\n\n## Pull request\n\n'
            printf 'Number: %s\n' "$PR_NUMBER"
            printf 'Title: %s\n' "$PR_TITLE"
            printf 'URL: %s\n\n' "$PR_URL"
            printf 'Branch: %s\n\n' "$HEAD_REF"
            printf '### Description\n\n%s\n' "$PR_BODY"
          } >> /tmp/fix-prompt.md
          delimiter="$(openssl rand -hex 16)"
          {
            echo "prompt<<${delimiter}"
            cat /tmp/fix-prompt.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude fix pass
        if: steps.marker.outputs.already_fixed != 'true'
        id: claude_fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.build-fix-prompt.outputs.prompt }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(pytest:*),Bash(python:*),Bash(npm:*),Bash(npx:*),Bash(make:*),Bash(cargo:*),Bash(go test:*),Bash(go:*)"

      - name: Salvage partial fix pass work
        if: always() && steps.marker.outputs.already_fixed != 'true' && steps.claude_fix.conclusion == 'failure'
        id: salvage
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          SALVAGE_MARKER="<!-- factory:fix-salvage:${RUN_ID} -->"
          COMMENTS="$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body')"
          if grep -Fq "$SALVAGE_MARKER" <<< "$COMMENTS"; then
            echo "Salvage comment already posted for this run; skipping."
            exit 0
          fi

          git fetch origin "$HEAD_REF"
          HAS_WORK=false
          if [[ -n "$(git status --porcelain)" ]]; then
            HAS_WORK=true
          fi
          AHEAD="$(git rev-list --count "origin/${HEAD_REF}"..HEAD 2>/dev/null || echo 0)"
          if [[ "$AHEAD" -gt 0 ]]; then
            HAS_WORK=true
          fi

          ARTIFACT_NOTE="nothing to save (no unpushed commits or uncommitted changes)"
          PUSHED_NOTE="no partial commits were pushed"
          if [[ "$HAS_WORK" == "true" ]]; then
            {
              git diff "origin/${HEAD_REF}"...HEAD || true
              git diff || true
            } > /tmp/fix-pass-partial.patch
            if [[ -s /tmp/fix-pass-partial.patch ]]; then
              echo "has_artifact=true" >> "$GITHUB_OUTPUT"
              ARTIFACT_NOTE="partial diff saved as workflow artifact \`fix-pass-partial-${PR_NUMBER}\` (download from this run)"
            else
              ARTIFACT_NOTE="no diff content to save"
            fi

            if [[ -d .github/workflows ]]; then
              git checkout "origin/${HEAD_REF}" -- .github/workflows/ || true
            fi

            if [[ -f requirements.txt ]]; then
              python -m pip install -r requirements.txt pytest -q
              if python -m pytest -q; then
                if [[ -n "$(git status --porcelain)" ]]; then
                  git add -A
                  git commit -m "Fix pass (partial, turn limit reached)"
                  if git push origin "HEAD:${HEAD_REF}"; then
                    PUSHED_NOTE="partial fixes were committed and pushed (workflow file edits excluded)"
                  else
                    PUSHED_NOTE="tests passed but push failed; see artifact for the diff"
                  fi
                fi
              else
                PUSHED_NOTE="tests failed after excluding workflow edits; nothing was pushed"
              fi
            else
              if [[ -n "$(git status --porcelain)" ]]; then
                git add -A
                git commit -m "Fix pass (partial, turn limit reached)"
                if git push origin "HEAD:${HEAD_REF}"; then
                  PUSHED_NOTE="partial fixes were committed and pushed (workflow file edits excluded)"
                else
                  PUSHED_NOTE="push failed; see artifact for the diff"
                fi
              fi
            fi
          fi

          BODY="$(printf '%s\n\nFactory: the **Claude fix pass** stopped early (turn limit or error).\n\n- Partial work: %s\n- Salvage: %s\n- Run: %s\n\nRe-add the **agent-review** label to retry the fix pass, or merge manually if the PR is ready.' "$SALVAGE_MARKER" "$PUSHED_NOTE" "$ARTIFACT_NOTE" "$RUN_URL")"
          gh pr comment "$PR_NUMBER" --body "$BODY"

      - name: Upload fix pass partial artifact
        if: always() && steps.salvage.outputs.has_artifact == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fix-pass-partial-${{ github.event.pull_request.number }}
          path: /tmp/fix-pass-partial.patch

      - name: Post fix marker
        if: steps.marker.outputs.already_fixed != 'true' && steps.claude_fix.outcome == 'success'
        run: gh pr comment "$PR_NUMBER" --body "${{ steps.marker.outputs.marker }}"

      - name: Report fix pass commits
        if: always() && steps.marker.outputs.already_fixed != 'true'
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BEFORE_SHA: ${{ steps.head-before.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_REF"
          AFTER_SHA="$(git rev-parse "origin/$HEAD_REF")"
          if [[ "$BEFORE_SHA" == "$AFTER_SHA" ]]; then
            gh pr comment "$PR_NUMBER" --body "Fix pass pushed no commits"
          else
            COUNT="$(git rev-list --count "$BEFORE_SHA..$AFTER_SHA")"
            SUBJECTS="$(git log --format='%s' "$BEFORE_SHA..$AFTER_SHA" | paste -sd '; ' -)"
            gh pr comment "$PR_NUMBER" --body "Fix pass pushed ${COUNT} commit(s): ${SUBJECTS}"
          fi

      - name: Post factory usage report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude_fix.outputs.execution_file }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: python3 .github/scripts/usage_report.py --job fix

  merge:
    needs: fix
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent-review' &&
      github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Wait for checks and merge into dev
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          BLOCK_ON_OPEN: ${{ vars.FACTORY_BLOCK_ON_OPEN_FINDINGS }}
        run: |
          set -euo pipefail
          COMMENTS="$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body')"
          FIX_RESULT="all-addressed"
          if grep -Fq '<!-- factory:fix-result:open-findings -->' <<< "$COMMENTS"; then
            FIX_RESULT="open-findings"
          elif grep -Fq '<!-- factory:fix-result:all-addressed -->' <<< "$COMMENTS"; then
            FIX_RESULT="all-addressed"
          fi

          if [[ "$FIX_RESULT" == "open-findings" && "$BLOCK_ON_OPEN" == "true" ]]; then
            gh pr comment "$PR_NUMBER" --body "Factory: this PR was left open because review findings remain unaddressed (see **Fix pass result**). Merge manually after resolving them, or update the fix pass outcome."
            exit 0
          fi

          HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)"

          FACTORY_CI_RUN=""
          for _ in $(seq 1 24); do
            FACTORY_CI_RUN="$(gh run list --commit="$HEAD_SHA" --workflow=factory-ci.yml --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$FACTORY_CI_RUN" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$FACTORY_CI_RUN" ]]; then
            gh pr comment "$PR_NUMBER" --body "Factory: automatic merge into \`dev\` skipped — the Factory CI check did not appear on the current head commit within two minutes after the Claude fix pass."
            exit 0
          fi

          if ! gh run watch "$FACTORY_CI_RUN" --exit-status; then
            gh pr comment "$PR_NUMBER" --body "Factory: automatic merge into \`dev\` skipped — Factory CI did not pass on the current head commit after the Claude fix pass."
            exit 0
          fi
          if ! gh pr merge "$PR_NUMBER" --merge; then
            gh pr comment "$PR_NUMBER" --body "Factory: automatic merge into \`dev\` failed (for example the PR may already be merged or checks regressed). Please merge manually if the PR is still open and CI is green."
            exit 0
          fi

          if [[ "$FIX_RESULT" == "open-findings" ]]; then
            gh pr comment "$PR_NUMBER" --body "Factory: merged into \`dev\` with open review findings (\`FACTORY_BLOCK_ON_OPEN_FINDINGS\` is not \`true\`)."
          fi

      - uses: actions/checkout@v4
        if: always()
        with:
          fetch-depth: 1

      - name: Post factory usage report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLAUDE_EXECUTION_FILE: ''
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: python3 .github/scripts/usage_report.py --job merge

  notify-failure:
    needs: [review, fix, merge]
    if: >
      always() &&
      contains(needs.*.result, 'failure') &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent-review' &&
      github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Post failure comment on PR
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          NEEDS_REVIEW: ${{ needs.review.result }}
          NEEDS_FIX: ${{ needs.fix.result }}
          NEEDS_MERGE: ${{ needs.merge.result }}
        run: |
          set -euo pipefail
          MARKER="<!-- factory:claude-failure:${RUN_ID} -->"
          COMMENTS="$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body')"
          if grep -Fq "$MARKER" <<< "$COMMENTS"; then
            echo "Failure comment already posted for this run; skipping."
            exit 0
          fi

          FAILED_JOBS=()
          [[ "$NEEDS_REVIEW" == "failure" ]] && FAILED_JOBS+=("review")
          [[ "$NEEDS_FIX" == "failure" ]] && FAILED_JOBS+=("fix")
          [[ "$NEEDS_MERGE" == "failure" ]] && FAILED_JOBS+=("merge")
          FAILED_LIST="$(IFS=', '; echo "${FAILED_JOBS[*]}")"
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          FIX_NOTE=""
          if [[ "$NEEDS_FIX" == "failure" ]]; then
            FIX_NOTE=$'\n\nIf the **fix** job hit the turn limit or another error, check the run for a **Salvage partial fix pass work** step: partial commits may have been pushed after tests, or only saved as artifact \`fix-pass-partial-<PR>\` (workflow file edits are never pushed). A salvage comment on the PR describes the outcome. No fix-once marker is posted on fix failure, so re-adding **agent-review** retries the fix pass.'
          fi
          BODY="$(printf '%s\n\nFactory: the **Claude review** workflow failed.\n\nFailed jobs: %s\nRun: %s\n\nThe owner needs to look at the failure. Add the **agent-review** label again to retry. If the **fix** job failed, no fix-once marker was posted, so the fix pass will run again. If a previous run completed the fix job successfully, the fix-once marker prevents a second fix pass until you remove that marker comment or merge without it.%s' "$MARKER" "$FAILED_LIST" "$RUN_URL" "$FIX_NOTE")"
          gh pr comment "$PR_NUMBER" --body "$BODY"

      - name: Mark linked issue factory-blocked
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          ISSUE_NUM="$(printf '%s\n' "$PR_BODY" | grep -Eio 'closes #[0-9]+' | grep -Eo '[0-9]+' | head -1 || true)"
          if [[ -z "$ISSUE_NUM" ]]; then
            echo "No Closes #N in PR body; skipping issue label update."
            exit 0
          fi

          LABELS="$(gh issue view "$ISSUE_NUM" --json labels --jq '.labels[].name')"
          if grep -Fxq 'factory-done' <<< "$LABELS"; then
            echo "Issue #${ISSUE_NUM} is factory-done; skipping label update."
            exit 0
          fi

          FACTORY_STATUS=(
            factory-queued
            factory-dev
            factory-review
            factory-waiting-dev
            factory-test
            factory-fixer
            factory-conflict
            factory-waiting-main
            factory-done
            factory-blocked
          )
          for label in "${FACTORY_STATUS[@]}"; do
            if [[ "$label" != "factory-blocked" ]] && grep -Fxq "$label" <<< "$LABELS"; then
              gh issue edit "$ISSUE_NUM" --remove-label "$label"
            fi
          done
          gh issue edit "$ISSUE_NUM" --add-label factory-blocked

